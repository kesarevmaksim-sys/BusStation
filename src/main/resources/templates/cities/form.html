<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<body>
<section th:fragment="section">
    <div class="page-header">
        <h1 th:text="${city.id != null} ? 'Редактирование города' : 'Новый город'">Город</h1>
        <a class="btn" th:href="@{/cities}">Назад</a>
    </div>

    <form class="form" th:action="${city.id != null} ? @{/cities/{id}(id=${city.id})} : @{/cities}"
          th:object="${city}" method="post">
        <div class="field">
            <label for="name">Название *</label>
            <input id="name" type="text" th:field="*{name}" required maxlength="100">
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="field">
            <label for="region">Регион</label>
            <input id="region" type="text" th:field="*{region}" maxlength="100">
        </div>
        <div class="field">
            <label for="timezoneId">Часовой пояс (IANA)</label>
            <input id="timezoneId" type="text" th:field="*{timezoneId}" maxlength="100"
                   placeholder="Europe/Moscow">
            <small>Например: Europe/Moscow, Europe/Samara, Asia/Yekaterinburg</small>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</section>
</body>
</html>
