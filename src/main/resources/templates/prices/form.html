<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<body>
<section th:fragment="section">
    <div class="page-header">
        <h1 th:text="${price.id != null} ? 'Редактирование цены' : 'Новая цена'">Цена</h1>
        <a class="btn" th:href="@{/prices}">Назад</a>
    </div>

    <form class="form"
          th:action="${price.id != null} ? @{/prices/{id}(id=${price.id})} : @{/prices}"
          th:object="${price}" method="post">
        <div class="field">
            <label for="routeId">Маршрут *</label>
            <select id="routeId" th:field="*{routeId}" required>
                <option value="">— выберите —</option>
                <option th:each="route : ${routes}"
                        th:value="${route.id}"
                        th:text="${route.displayName}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('routeId')}" th:errors="*{routeId}"></span>
        </div>
        <div class="field">
            <label for="amount">Сумма (₽) *</label>
            <input id="amount" type="number" th:field="*{amount}" step="0.01" min="0.01" required>
            <span class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
        </div>
        <div class="field">
            <label for="validFrom">Действует с *</label>
            <input id="validFrom" type="date" th:field="*{validFrom}" required>
        </div>
        <div class="field">
            <label for="validTo">Действует до</label>
            <input id="validTo" type="date" th:field="*{validTo}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</section>
</body>
</html>
